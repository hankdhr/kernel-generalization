name: CPU protocol checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m kernel_generalization check data/pilot-v0.jsonl
      - run: python scripts/run_probe.py --plan-only --out runs/ci-probe-plan
